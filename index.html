<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic Tracker</title>
<link rel="icon" type="image/png" href="logo.png?v=1">
<link rel="apple-touch-icon" href="logo.png?v=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<main id="app"></main>
<script>
/* If something goes wrong, show the reason instead of a blank page */
addEventListener("error",function(e){
  var m=document.getElementById("app");
  if(!m||m.innerHTML.trim())return;
  var f=function(s){return String(s||"").split("/").pop().split("?")[0]};
  var t=e.target&&e.target.src?"Could not load "+f(e.target.src):(e.message||"Unknown error")+" ("+f(e.filename)+", line "+e.lineno+")";
  m.innerHTML='<h1 style="font-family:sans-serif">Academic Tracker</h1><p style="font-family:sans-serif;line-height:1.5">The page could not load: '+t+'. Try a hard refresh. If it still fails, contact Jeoff.</p>';
},true);
</script>
<script src="data.js?v=21"></script>
<script src="app.js?v=21"></script>
<script src="hard.js?v=21"></script>
<script src="edit.js?v=21"></script>
<script src="timer.js?v=21"></script>
<script src="log.js?v=21"></script>
<script src="doubts.js?v=21"></script>
<script src="week.js?v=21"></script>
<script src="reward.js?v=21"></script>
<script src="nav.js?v=21"></script>
<script>if(window.__start)window.__start();</script>
</body>
</html>
